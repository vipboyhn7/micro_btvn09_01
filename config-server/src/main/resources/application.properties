spring.application.name=config-server
server.port=${CONFIG_SERVER_PORT:8888}

# Run scripts/run-config-server.sh to prepare the local Git repository.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:file://${user.dir}/.local/config-repo}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=0
spring.cloud.config.server.accept-empty=false
management.endpoints.web.exposure.include=health,info
